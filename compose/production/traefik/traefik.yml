log:
  level: INFO

entryPoints:
  web:
    # http
    address: ':80'
    http:
      # https://doc.traefik.io/traefik/routing/entrypoints/#entrypoint
      redirections:
        entryPoint:
          to: web-secure

  web-secure:
    # https
    address: ':443'

  flower:
    address: ':5555'

certificatesResolvers:
  letsencrypt:
    # https://doc.traefik.io/traefik/https/acme/#lets-encrypt
    acme:
      email: 'ladeirajuan96@gmail.com'
      storage: /etc/traefik/acme/acme.json
      # DNS challenge via API da Hostinger (HOSTINGER_API_TOKEN em .envs/.production/.traefik).
      # Permite o certificado curinga *.dominio: todo tenant novo já nasce com HTTPS.
      # https://go-acme.github.io/lego/dns/hostinger/
      dnsChallenge:
        provider: hostinger
        resolvers:
          - '1.1.1.1:53'
          - '8.8.8.8:53'
        propagation:
          delayBeforeChecks: 30s

http:
  routers:
    # Domínio principal e qualquer subdomínio de tenant (xn--ladeirasolues-sgb4s.tech = ladeirasoluções.tech)
    web-secure-router:
      rule: 'Host(`xn--ladeirasolues-sgb4s.tech`) || HostRegexp(`^[a-z0-9-]+\.xn--ladeirasolues-sgb4s\.tech$`)'
      entryPoints:
        - web-secure
      middlewares:
        - csrf
      service: django
      tls:
        # https://doc.traefik.io/traefik/routing/routers/#certresolver
        certResolver: letsencrypt
        domains:
          - main: 'xn--ladeirasolues-sgb4s.tech'
            sans:
              - '*.xn--ladeirasolues-sgb4s.tech'

    flower-secure-router:
      rule: 'Host(`xn--ladeirasolues-sgb4s.tech`)'
      entryPoints:
        - flower
      service: flower
      tls:
        certResolver: letsencrypt

    web-media-router:
      rule: '(Host(`xn--ladeirasolues-sgb4s.tech`) || HostRegexp(`^[a-z0-9-]+\.xn--ladeirasolues-sgb4s\.tech$`)) && PathPrefix(`/media/`)'
      entryPoints:
        - web-secure
      middlewares:
        - csrf
      service: django-media
      tls:
        certResolver: letsencrypt

  middlewares:
    csrf:
      # https://doc.traefik.io/traefik/master/middlewares/http/headers/#hostsproxyheaders
      # https://docs.djangoproject.com/en/dev/ref/csrf/#ajax
      headers:
        hostsProxyHeaders: ['X-CSRFToken']

  services:
    django:
      loadBalancer:
        servers:
          - url: http://django:5000

    flower:
      loadBalancer:
        servers:
          - url: http://flower:5555

    django-media:
      loadBalancer:
        servers:
          - url: http://nginx:80

providers:
  # https://doc.traefik.io/traefik/master/providers/file/
  file:
    filename: /etc/traefik/traefik.yml
    watch: true
