volumes:
  plataforma_de_servicos_local_postgres_data: {}
  plataforma_de_servicos_local_postgres_data_backups: {}
  plataforma_de_servicos_local_redis_data: {}

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: plataforma_de_servicos_local_django
    container_name: plataforma_de_servicos_local_django
    depends_on:
      - postgres
      - redis
      - mailpit
    volumes:
      - .:/app:z
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
    ports:
      - '8000:8000'
    command: /start
    networks:
      - plataforma_network

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: plataforma_de_servicos_production_postgres
    container_name: plataforma_de_servicos_local_postgres
    volumes:
      - plataforma_de_servicos_local_postgres_data:/var/lib/postgresql/data
      - plataforma_de_servicos_local_postgres_data_backups:/backups
    env_file:
      - ./.envs/.local/.postgres
    networks:
      - plataforma_network

  mailpit:
    image: docker.io/axllent/mailpit:latest
    container_name: plataforma_de_servicos_local_mailpit
    ports:
      - "8025:8025"
    networks:
      - plataforma_network

  redis:
    image: docker.io/redis:6
    container_name: plataforma_de_servicos_local_redis
    
    volumes:
      - plataforma_de_servicos_local_redis_data:/data
    networks:
      - plataforma_network
    

  celeryworker:
    <<: *django
    image: plataforma_de_servicos_local_celeryworker
    container_name: plataforma_de_servicos_local_celeryworker
    depends_on:
      - redis
      - postgres
      - mailpit
    ports: []
    command: /start-celeryworker
    networks:
      - plataforma_network

  celerybeat:
    <<: *django
    image: plataforma_de_servicos_local_celerybeat
    container_name: plataforma_de_servicos_local_celerybeat
    depends_on:
      - redis
      - postgres
      - mailpit
    ports: []
    command: /start-celerybeat
    networks:
      - plataforma_network

  flower:
    <<: *django
    image: plataforma_de_servicos_local_flower
    container_name: plataforma_de_servicos_local_flower
    ports:
      - '5555:5555'
    command: /start-flower
    depends_on:
      - redis
      - postgres
      - mailpit
    networks:
      - plataforma_network

  mcp_server:
    build:
      context: .
      dockerfile: ./compose/local/mcp_server/Dockerfile
    image: plataforma_de_servicos_local_mcp_server
    container_name: plataforma_de_servicos_local_mcp_server
    ports:
      - '8001:8001'
    env_file:
      - ./.envs/.local/.django
    depends_on:
      - django
    networks:
      - plataforma_network
      
networks:
  plataforma_network:
    driver: bridge
