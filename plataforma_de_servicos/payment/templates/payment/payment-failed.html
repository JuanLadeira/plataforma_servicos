
{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-lg border-0 text-center my-5">
                <div class="card-body p-5">
                    <i class="fa fa-times-circle fa-4x text-danger mb-4"></i>
                    <h1 class="h3 fw-bold">Falha no Pagamento</h1>
                    <p class="text-muted">Houve um problema ao processar seu pagamento. Por favor, tente novamente ou entre em contato com o suporte.</p>
                    <div class="d-grid gap-2 mt-4">
                        <a href="{% url 'cart:cart-summary' %}" class="btn btn-primary">Tentar Novamente</a>
                        <a href="{% url 'home' %}" class="btn btn-outline-secondary">Voltar para a Loja</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
