
{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-lg border-2 border-danger">
                <div class="card-body p-5 text-center">
                    <i class="fa fa-exclamation-triangle fa-4x text-danger mb-4"></i>
                    <h1 class="h3 fw-bold">Confirmar Exclusão da Conta</h1>
                    <p class="text-muted">Você tem certeza de que deseja excluir sua conta? Esta ação é permanente e não pode ser desfeita.</p>
                    
                    <form method="POST" autocomplete="off" class="mt-4">
                        {% csrf_token %}
                        <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                            <button type="submit" class="btn btn-danger">Sim, Excluir Minha Conta</button>
                            <a class="btn btn-outline-secondary" href="{% url 'profile-management' %}">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
