
{% extends "base.html" %}
{% load static %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0 my-5">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <h1 class="h3 fw-bold">Bem-vindo de volta!</h1>
                        <p class="text-muted">Faça login para continuar.</p>
                    </div>
                    
                    <form method="POST" autocomplete="off">
                        {% csrf_token %}
                        
                        {{ form|crispy }}

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary">
                                <i class="fa fa-key" aria-hidden="true"></i> &nbsp; Login
                            </button>
                        </div>

                        <div class="text-center mt-4">
                            <a class="small" href="{% url 'register' %}">Não tem uma conta? Cadastre-se!</a>
                            <br>
                            <a class="small" href="{% url 'reset_password' %}">Esqueceu sua senha?</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
