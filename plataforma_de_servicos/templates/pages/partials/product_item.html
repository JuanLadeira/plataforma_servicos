
<div class="card shadow-sm m-2">
    <a href="{{ product.url }}">
        <img class="img-fluid" alt="Imagem de {{ product.produto }}" src="{{ product.imagem }}">
    </a>
    <div class="card-body">
        <div>
            <p class="card-text">
                <a href="{{ product.url }}">
                    {{ product.produto|truncatechars:25 }}
                </a>
            </p>
            <div class="d-flex justify-content-between align-items-center">
                <h5 class="mb-0">R$ {{ product.preco }}</h5>
                <small class="text-muted">Estoque: {{ product.estoque }}</small>
            </div>
        </div>
        <a href="{% url 'cart:cart-summary' %}" class="mt-3">
            <button 
                type="button" 
                id="add-button-{{ product.id }}" 
                value="{{ product.id }}" 
                class="btn btn-primary btn-sm" 
                hx-post="{% url 'cart:cart-add' %}" 
                hx-vals='{"product_id": "{{ product.id }}", "action": "post", "product_quantity": 1}' 
                hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                hx-swap="none"
            >
                <i class="fa fa-plus" aria-hidden="true"></i>
                Adicionar ao carrinho
            </button>
        </a>
    </div>
</div>
