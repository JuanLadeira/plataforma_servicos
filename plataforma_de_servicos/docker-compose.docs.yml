services:
  docs:
    image: plataforma_de_servicos_local_docs
    container_name: plataforma_de_servicos_local_docs
    build:
      context: .
      dockerfile: ./compose/local/docs/Dockerfile
    env_file:
      - ./.envs/.local/.django
    volumes:
      - ./docs:/docs:z
      - ./config:/app/config:z
      - ./plataforma_de_servicos:/app/plataforma_de_servicos:z
    ports:
      - '9000:9000'
    command: /start-docs
